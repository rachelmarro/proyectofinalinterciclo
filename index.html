<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Coffee</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Velvet Coffee</h1>
        <p>Tu rincón de café con estilo</p>
    </header>

    <main>

        <section class="bienvenida">
            <h2>Bienvenido</h2>
            <p>
                Disfruta de nuestros cafés artesanales y postres caseros

            </p>

            <img src="img/Foto25.jpg" alt="Velvet Coffee" class="imagen-principal">
        </section>

        <section>
            <h2>Menú</h2>

            <div class="menu-lista">
                <div>
                    <h3>Espresso</h3>
                    <p>$2.00</p>
                </div>

                <div>
                    <h3>Cappuccino</h3>
                    <p>$2.50</p>
                </div>

                <div>
                    <h3>Latte</h3>
                    <p>$3.00</p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Velvet Coffee</p>
    </footer>

</body>
</html>
